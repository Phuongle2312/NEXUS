# Reverse Proxy Gateway Configuration for NEXUS System
events { worker_connections 1024; }

http {
    upstream backend {
        server backend:8081;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://frontend;
        }

        location /nexus/api/ {
            proxy_pass http://backend/nexus/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

