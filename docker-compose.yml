# =============================================================================
# NEXUS Service Marketing System - môi trường chạy bằng Docker
#
# Kiến trúc monolith:
#   frontend (React/Vite + Nginx)  ──HTTP──▶  backend (ASP.NET Core Web API .NET 10)
#                                                    │
#                                                    ▼
#                                          sqlserver (SQL Server 2022)
# Không còn API gateway và không dùng microservice.
# =============================================================================
services:
  # ------------------------------ Cơ sở dữ liệu ------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexus-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword!2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Tạo schema + dữ liệu mẫu một lần, sau khi SQL Server sẵn sàng.
  # Dùng image sqlcmd riêng vì image mssql/server không tự chạy script trong initdb.d.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexus-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database:/scripts:ro
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'YourStrongPassword!2026' -C
      -Q \"IF DB_ID('NEXUS') IS NULL CREATE DATABASE NEXUS\" &&
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'YourStrongPassword!2026' -C -d NEXUS -i /scripts/schema.sql &&
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'YourStrongPassword!2026' -C -d NEXUS -i /scripts/seed.sql
      "
    restart: "no"

  # --------------------------- Backend .NET 10 ------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexus-backend
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Nexus: "Server=sqlserver,1433;Database=NEXUS;User Id=sa;Password=YourStrongPassword!2026;TrustServerCertificate=True;MultipleActiveResultSets=true"
      # Khoá JWT tối thiểu 32 ký tự. Đổi giá trị này khi triển khai thật.
      Jwt__Key: "NexusDockerSigningKey-ChangeMe-2026-AtLeast32Chars"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------ Web client --------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mssql-data: