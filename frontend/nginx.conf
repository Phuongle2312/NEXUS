server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén các tài nguyên tĩnh để giảm băng thông.
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Chuyển tiếp toàn bộ /api sang backend ASP.NET Core (.NET 10).
    # Trong docker compose, tên service backend phân giải thành nexus-backend.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA React: mọi route không phải file tĩnh đều trả index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache lâu cho asset có hash trong tên.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}